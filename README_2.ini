# 5GLOS - 5G Load balancer and Orchestration System

5GLOS is a Kubernetes-native 5G load balancer that provides intelligent traffic distribution for AMF (Access and Mobility Management Function) instances in a 5G core network.

## Features

- **Dynamic AMF Discovery**: Automatically discovers AMF pods in Kubernetes using label selectors
- **Load Balancing**: Round-robin load balancing with session affinity
- **SCTP Proxy**: Native SCTP proxy for NGAP signaling between gNB and AMF
- **Session Management**: Tracks gNB-UE sessions and maintains AMF bindings
- **NGAP Message Parsing**: Extracts UE and gNB identifiers from NGAP messages
- **Health Monitoring**: Monitors AMF endpoint health and removes unhealthy instances
- **Structured Logging**: Comprehensive logging with configurable levels and formats

## Architecture

```
┌─────────────┐    SCTP/NGAP    ┌─────────────┐    Load Balance    ┌─────────────┐
│   UERANSIM  │ ──────────────> │   5GLOS     │ ──────────────────> │     AMF     │
│     gNB     │                 │   Proxy     │                     │   Instances │
└─────────────┘                 └─────────────┘                     └─────────────┘
                                       │
                                       ▼
                                ┌─────────────┐
                                │ Kubernetes  │
                                │   Client    │
                                └─────────────┘
```

## Getting Started

### Prerequisites

- Go 1.21 or later
- Kubernetes cluster with 5G core network deployed
- SCTP support enabled on the host

### Installation

1. Clone the repository:
```bash
git clone https://github.com/hasukiHT/5glos.git
cd 5glos
```

2. Install dependencies:
```bash
go mod tidy
```

3. Configure the application by editing `config.yaml`:
```yaml
listen_port: 38412
namespace: "free5gc"
amf_label: "nf=amf"
load_balancer_strategy: "round-robin"
logging:
  level: "info"
  format: "json"
  time_format: "2006-01-02T15:04:05Z07:00"
```

4. Build and run:
```bash
go build -o 5glos
./5glos
```

### Configuration

The application uses a YAML configuration file (`config.yaml`) with the following options:

- `listen_port`: Port to listen for gNB connections (default: 38412)
- `namespace`: Kubernetes namespace containing AMF pods
- `amf_label`: Label selector for discovering AMF pods
- `load_balancer_strategy`: Load balancing algorithm (currently supports "round-robin")
- `logging`: Logging configuration
  - `level`: Log level (debug, info, warn, error, fatal)
  - `format`: Log format (json, console)
  - `time_format`: Timestamp format

### Usage

1. Deploy your 5G core network (e.g., free5GC) in Kubernetes
2. Ensure AMF pods have the correct labels (e.g., `nf=amf`)
3. Start 5GLOS with the appropriate configuration
4. Configure UERANSIM gNB to connect to 5GLOS proxy address

### Kubernetes Deployment

Example Kubernetes deployment:

```yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: 5glos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: 5glos
  template:
    metadata:
      labels:
        app: 5glos
    spec:
      containers:
      - name: 5glos
        image: 5glos:latest
        ports:
        - containerPort: 38412
          protocol: SCTP
        volumeMounts:
        - name: config
          mountPath: /app/config.yaml
          subPath: config.yaml
      volumes:
      - name: config
        configMap:
          name: 5glos-config
---
apiVersion: v1
kind: Service
metadata:
  name: 5glos-service
spec:
  type: NodePort
  ports:
  - port: 38412
    protocol: SCTP
    nodePort: 30412
  selector:
    app: 5glos
```

## Monitoring

5GLOS provides structured logging that can be integrated with log aggregation systems like ELK stack or Prometheus/Grafana for monitoring:

- Connection metrics
- Session tracking
- Load balancing decisions
- AMF health status
- NGAP message statistics

