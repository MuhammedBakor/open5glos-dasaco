apiVersion: apps/v1
kind: Deployment
metadata:
  name: open5glos
  namespace: free5gc
  labels:
    app: free5gc
    nf: open5glos
    io.service: open5glos
spec:
  replicas: 1
  selector:
    matchLabels:
      nf: open5glos
  template:
    metadata:
      labels:
        app: free5gc
        nf: open5glos
        io.service: open5glos
    spec:
      serviceAccountName: open5glos
      containers:
      - name: open5glos
        image: open5glos:dasaco-dynamic-admission
        imagePullPolicy: IfNotPresent
        args:
        - /etc/5glos/config.yaml
        ports:
        - containerPort: 38412
          name: ngap
          protocol: SCTP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        - containerPort: 9091
          name: admission-api
          protocol: TCP
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: ADMISSION_MODE
          value: "OPEN"
        - name: ADMISSION_CONTROL_ADDRESS
          value: ":9091"
        volumeMounts:
        - name: config
          mountPath: /etc/5glos
          readOnly: true
        livenessProbe:
          httpGet:
            path: /healthz
            port: admission-api
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: admission-api
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 6
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: config
        configMap:
          name: 5glos-config
