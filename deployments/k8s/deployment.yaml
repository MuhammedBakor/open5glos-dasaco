apiVersion: apps/v1
kind: Deployment
metadata:
  name: 5glos-gateway
  namespace: free5gc
  labels:
    app: free5gc
    nf: 5glos-gateway
    io.service: 5glos-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: free5gc
      nf: 5glos-gateway
      io.service: 5glos-gateway
  template:
    metadata:
      labels:
        app: free5gc
        nf: 5glos-gateway
        io.service: 5glos-gateway
    spec:
      serviceAccountName: 5glos-gateway
      containers:
      - name: 5glos-gateway
        image: 5glos-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 38412
          name: ngap
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        volumeMounts:
        - name: config
          mountPath: /etc/5glos
          readOnly: true
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: config
        configMap:
          name: 5glos-config