apiVersion: apps/v1
kind: Deployment
metadata:
  name: open5glos
  namespace: free5gc
  labels:
    app: free5gc
    nf: open5glos
    io.service: open5glos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: free5gc
      nf: open5glos
      io.service: open5glos
  template:
    metadata:
      labels:
        app: free5gc
        nf: open5glos
        io.service: open5glos
    spec:
      serviceAccountName: open5glos
      containers:
      - name: open5glos
        image: your-registry/5glos:latest  # Update this to your registry
        imagePullPolicy: Always
        ports:
        - containerPort: 38412
          name: ngap
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        volumeMounts:
        - name: config
          mountPath: /etc/5glos
          readOnly: true
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: config
        configMap:
          name: 5glos-config