apiVersion: v1
kind: ConfigMap
metadata:
  name: 5glos-config
  namespace: free5gc
data:
  config.yaml: |
    proxy:
      listen_addr: "0.0.0.0"
      listen_port: 38412
      read_timeout: "30s"
      write_timeout: "30s"
      buffer_size: 4096
      max_connections: 1000

    kubernetes:
      namespace: "free5gc"
      amf_selector: "nf=amf"
      pod_timeout: "5m"
      resync_period: "30s"
      in_cluster: true
      kubeconfig_path: ""

    load_balancer:
      strategy: "round-robin"
      health_check_interval: "10s"
      session_timeout: "30m"
      max_retries: 3

    logging:
      level: "info"
      format: "json"
      output: "stdout"

    # metrics:
    #   enabled: true
    #   port: 9090
    #   path: "/metrics"