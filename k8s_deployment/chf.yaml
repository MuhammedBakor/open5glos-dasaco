apiVersion: v1
kind: Service
metadata:
  annotations:
    version: v1.0.0
  labels:
    app: free5gc
    nf: chf
    io.service: chf
  name: chf-nchf
  namespace: free5gc
spec:
  ports:
    - name: "chf-nchf"
      port: 8000
      targetPort: 8000
  selector:
    app: free5gc
    nf: chf
    io.service: chf
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    version: v1.0.0
  labels:
    app: free5gc
    nf: chf
    io.service: chf
  name: chf
  namespace: free5gc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: free5gc
      nf: chf
      io.service: chf
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        version: v1.0.0
      labels:
        app: free5gc
        nf: chf
        io.service: chf
    spec:
      containers:
        - args:
            - ./chf
            - -c
            - ./config/chfcfg.yaml
          env:
            - name: DB_URI
              value: mongodb://db/free5gc
            - name: GIN_MODE
              value: release
          image: free5gc/chf:latest
          name: chf
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          ports:
            - containerPort: 8000
              protocol: TCP
          volumeMounts:
            - mountPath: /free5gc/config/chfcfg.yaml
              name: chf-cm0
              subPath: chfcfg.yaml
            - mountPath: /free5gc/cert
              name: chf-cert-writable
      initContainers:
        - name: init-cert
          image: busybox:latest
          command:
            [
              "sh",
              "-c",
              "cp /cert/chf.pem /cert/chf.key /cert/nrf.pem /free5gc/cert/",
            ]
          volumeMounts:
            - mountPath: /cert
              name: chf-cert
            - mountPath: /free5gc/cert
              name: chf-cert-writable
      restartPolicy: Always
      volumes:
        - configMap:
            items:
              - key: chfcfg.yaml
                path: chfcfg.yaml
            name: chf-cm0
          name: chf-cm0
        - configMap:
            name: chf-cert
            items:
              - key: nrf.pem
                path: nrf.pem
              - key: chf.pem
                path: chf.pem
              - key: chf.key
                path: chf.key
          name: chf-cert
        - name: chf-cert-writable
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    use-subpath: "true"
  labels:
    app: free5gc
    io.service: chf
  name: chf-cm0
  namespace: free5gc
data:
  chfcfg.yaml: |
    info:
      version: 1.0.3
      description: CHF initial local configuration

    configuration:
      chfName: CHF # the name of this CHF
      sbi: # Service-based interface information
        scheme: http # the protocol for sbi (http or https)
        registerIPv4: chf-nchf # IP used to register to NRF
        bindingIPv4: 0.0.0.0 # IP used to bind the service
        port: 8000 # port used to bind the service
        tls: # the local path of TLS key
          pem: cert/chf.pem # CHF TLS Certificate
          key: cert/chf.key # CHF TLS Private key
      nrfUri: http://nrf-nnrf:8000 # a valid URI of NRF
      nrfCertPem: cert/nrf.pem # NRF Certificate
      serviceNameList: # the SBI services provided by this CHF, refer to TS 32.291
        - nchf-convergedcharging # Nchf_AMPolicyControl service
      mongodb: # the mongodb connected by this CHF
        name: free5gc # name of the mongodb
        url: mongodb://db:27017 # a valid URL of the mongodb
      quotaValidityTime: 10000
      volumeLimit: 50000
      volumeLimitPDU: 10000
      volumeThresholdRate: 0.8
      cgf:
        enable: true
        hostIPv4: webui
        port: 2121
        listenPort: 2122
        passiveTransferPortRange:
          start: 2123
          end: 2130
        tls:
          pem: cert/chf.pem
          key: cert/chf.key
        cdrFilePath: /tmp
      abmfDiameter:
        protocol: tcp
        hostIPv4: 0.0.0.0 
        port: 3868
        tls:
          pem: cert/chf.pem
          key: cert/chf.key
      rfDiameter:
        protocol: tcp
        hostIPv4: 0.0.0.0 
        port: 3869
        tls:
          pem: cert/chf.pem # CHF TLS Certificate
          key: cert/chf.key # CHF TLS Private key
    logger: # log output setting
      enable: true # true or false
      level: info # how detailed to output, value: trace, debug, info, warn, error, fatal, panic
      reportCaller: false # enable the caller report or not, value: true or false
---
