# 5GLOS Configuration File

# This file contains the configuration settings for the 5G Load Balancing and Orchestration System (5GLOS).
proxy:
  listen_addr: "127.0.0.10"
  listen_port: 38412
  read_timeout: "30s"
  write_timeout: "30s"
  buffer_size: 4096
  max_connections: 1000


# Kubernetes namespace for 5G services
kubernetes:
  namespace: "free5gc"
  amf_selector: "nf=amf"
  pod_timeout: "5m"
  resync_period: "30s"
  in_cluster: false
  kubeconfig_path: ""

# Load balancer settings
load_balancer:
  strategy: "round-robin"  # round-robin, least-connections
  health_check_interval: "10s"
  session_timeout: "30m"
  max_retries: 3

# Logging settings
logging:
  level: "info"
  format: "json"
  output: "stdout"

metrics:
  enabled: true
  port: 9090
  path: "/metrics"