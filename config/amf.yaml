apiVersion: v1
kind: Service
metadata:
  annotations:
    version: v1.0.0
  labels:
    app: free5gc
    nf: amf
    io.service: amf
  name: amf-namf
  namespace: free5gc
spec:
  clusterIP: None
  ports:
    - name: "amf-namf"
      port: 8000
      targetPort: 8000
      protocol: TCP
    - name: "n2"
      port: 38412
      targetPort: 38412
      protocol: SCTP
  externalIPs: 
    - 192.168.58.200 # external IP for AMF service
  selector:
    app: free5gc
    nf: amf
    io.service: amf
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    version: v1.0.0
  labels:
    app: free5gc
    nf: amf
    io.service: amf
  name: amf
  namespace: free5gc
spec:
  replicas: 3
  selector:
    matchLabels:
      app: free5gc
      nf: amf
      io.service: amf
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
            version: v1.0.0
      labels:
        app: free5gc
        nf: amf
        io.service: amf
    spec:
      containers:
        - args:
            - /bin/sh
            - -c
            - |
              # Generate unique AMF ID based on pod name hash or index
              POD_HASH=$(echo -n $POD_NAME | sha1sum | cut -c1-4)
              cat ./config/amfcfg.yaml.template | \
                sed "s/AMF_SET_ID/0000${POD_HASH:0:2}/" > ./config/amfcfg.yaml
                #sed "s/\$(POD_IP)/$POD_IP/g" > ./config/amfcfg.yaml
              cat ./config/amfcfg.yaml
              ./amf -c ./config/amfcfg.yaml
          # command: ["./amf", "-c", "./config/amfcfg.yaml"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: GIN_MODE
              value: release
          image: free5gc/amf:latest
          name: amf
          ports:
            - name: amf-namf
              containerPort: 8000
              protocol: TCP
            - name: n2
              containerPort: 38412
              protocol: SCTP
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          volumeMounts:
            - mountPath: /free5gc/config/amfcfg.yaml.template
              name: amf-cm0
              subPath: amfcfg.yaml.template
            - mountPath: /free5gc/cert
              name: amf-cert 
      restartPolicy: Always
      volumes:
        - configMap:
            items:
              - key: amfcfg.yaml.template
                path: amfcfg.yaml.template
            name: amf-cm0
          name: amf-cm0
        - name: amf-cert
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    use-subpath: "true"
  labels:
    app: free5gc
    io.service: amf
  name: amf-cm0
  namespace: free5gc
data:
  amfcfg.yaml.template: |
    info:
      version: 1.0.9
      description: AMF initial local configuration

    configuration:
      amfName: AMF_SET_ID # the name of this AMF
      ngapIpList:  # the IP list of N2 interfaces on this AMF
        - 0.0.0.0 #$(POD_IP)
      ngapPort: 38412 # the SCTP port listened by NGAP
      sbi: # Service-based interface information
        scheme: http # the protocol for sbi (http or https)
        registerIPv4: 0.0.0.0 #$(POD_IP) # amf-namf # IP used to register to NRF
        bindingIPv4: 0.0.0.0 # IP used to bind the service
        port: 8000 # port used to bind the service
        tls: # the local path of TLS key
          pem: cert/amf.pem # AMF TLS Certificate
          key: cert/amf.key # AMF TLS Private key
      serviceNameList: # the SBI services provided by this AMF, refer to TS 29.518
        - namf-comm # Namf_Communication service
        - namf-evts # Namf_EventExposure service
        - namf-mt   # Namf_MT service
        - namf-loc  # Namf_Location service
        - namf-oam  # OAM service
      servedGuamiList: # Guami (Globally Unique AMF ID) list supported by this AMF
        # <GUAMI> = <MCC><MNC><AMF ID>
        - plmnId: # Public Land Mobile Network ID, <PLMN ID> = <MCC><MNC>
            mcc: 208 # Mobile Country Code (3 digits string, digit: 0~9)
            mnc: 93 # Mobile Network Code (2 or 3 digits string, digit: 0~9)
          amfId: AMF_SET_ID # AMF identifier (3 bytes hex string, range: 000000~FFFFFF) i.e. cafe00
      supportTaiList:  # the TAI (Tracking Area Identifier) list supported by this AMF
        - plmnId: # Public Land Mobile Network ID, <PLMN ID> = <MCC><MNC>
            mcc: 208 # Mobile Country Code (3 digits string, digit: 0~9)
            mnc: 93 # Mobile Network Code (2 or 3 digits string, digit: 0~9)
          tac: 000001 # Tracking Area Code (3 bytes hex string, range: 000000~FFFFFF)
      plmnSupportList: # the PLMNs (Public land mobile network) list supported by this AMF
        - plmnId: # Public Land Mobile Network ID, <PLMN ID> = <MCC><MNC>
            mcc: 208 # Mobile Country Code (3 digits string, digit: 0~9)
            mnc: 93 # Mobile Network Code (2 or 3 digits string, digit: 0~9)
          snssaiList: # the S-NSSAI (Single Network Slice Selection Assistance Information) list supported by this AMF
            - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
              sd: 010203 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
            - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
              sd: 112233 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
      supportDnnList:  # the DNN (Data Network Name) list supported by this AMF
        - internet
      nrfUri: http://nrf-nnrf:8000 # a valid URI of NRF
      nrfCertPem: cert/nrf.pem
      security:  # NAS security parameters
        integrityOrder: # the priority of integrity algorithms
          - NIA2
          # - NIA0
        cipheringOrder: # the priority of ciphering algorithms
          - NEA0
          # - NEA2
      networkName:  # the name of this core network
        full: free5GC
        short: free
      ngapIE: # Optional NGAP IEs
        mobilityRestrictionList: # Mobility Restriction List IE, refer to TS 38.413
          enable: true # append this IE in related message or not
        maskedIMEISV: # Masked IMEISV IE, refer to TS 38.413
          enable: true # append this IE in related message or not
        redirectionVoiceFallback: # Redirection Voice Fallback IE, refer to TS 38.413
          enable: false # append this IE in related message or not
      nasIE: # Optional NAS IEs
        networkFeatureSupport5GS: # 5gs Network Feature Support IE, refer to TS 24.501
          enable: true # append this IE in Registration accept or not
          length: 1 # IE content length (uinteger, range: 1~3)
          imsVoPS: 0 # IMS voice over PS session indicator (uinteger, range: 0~1)
          emc: 0 # Emergency service support indicator for 3GPP access (uinteger, range: 0~3)
          emf: 0 # Emergency service fallback indicator for 3GPP access (uinteger, range: 0~3)
          iwkN26: 0 # Interworking without N26 interface indicator (uinteger, range: 0~1)
          mpsi: 0 # MPS indicator (uinteger, range: 0~1)
          emcN3: 0 # Emergency service support indicator for Non-3GPP access (uinteger, range: 0~1)
          mcsi: 0 # MCS indicator (uinteger, range: 0~1)
      t3502Value: 720  # timer value (seconds) at UE side
      t3512Value: 3600 # timer value (seconds) at UE side
      non3gppDeregTimerValue: 3240 # timer value (seconds) at UE side
      # retransmission timer for paging message
      t3513:
        enable: true     # true or false
        expireTime: 6s   # default is 6 seconds
        maxRetryTimes: 4 # the max number of retransmission
      # retransmission timer for NAS Deregistration Request message
      t3522:
        enable: true     # true or false
        expireTime: 6s   # default is 6 seconds
        maxRetryTimes: 4 # the max number of retransmission
      # retransmission timer for NAS Registration Accept message
      t3550:
        enable: true     # true or false
        expireTime: 6s   # default is 6 seconds
        maxRetryTimes: 4 # the max number of retransmission
      # retransmission timer for NAS Configuration Update Command message
      t3555:
        enable: true     # true or false
        expireTime: 6s   # default is 6 seconds
        maxRetryTimes: 4 # the max number of retransmission
      # retransmission timer for NAS Authentication Request/Security Mode Command message
      t3560:
        enable: true     # true or false
        expireTime: 6s   # default is 6 seconds
        maxRetryTimes: 4 # the max number of retransmission
      # retransmission timer for NAS Notification message
      t3565:
        enable: true     # true or false
        expireTime: 6s   # default is 6 seconds
        maxRetryTimes: 4 # the max number of retransmission
      # retransmission timer for NAS Identity Request message
      t3570:
        enable: true     # true or false
        expireTime: 6s   # default is 6 seconds
        maxRetryTimes: 4 # the max number of retransmission
      locality: area1 # Name of the location where a set of AMF, SMF, PCF and UPFs are located
      sctp: # set the sctp server setting <optinal>, once this field is set, please also add maxInputStream, maxOsStream, maxAttempts, maxInitTimeOut
        numOstreams: 3 # the maximum out streams of each sctp connection
        maxInstreams: 5 # the maximum in streams of each sctp connection
        maxAttempts: 2 # the maximum attempts of each sctp connection
        maxInitTimeout: 2 # the maximum init timeout of each sctp connection
      defaultUECtxReq: false # the default value of UE Context Request to decide when triggering Initial Context Setup procedure

    logger: # log output setting
      enable: true # true or false
      level: info # how detailed to output, value: trace, debug, info, warn, error, fatal, panic
      reportCaller: false # enable the caller report or not, value: true or false
# ---
